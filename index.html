<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusSaathi - Smart Bus Navigator</title>

    <!-- Leaflet Map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: #087f5b;
            --primary-dark: #056344;
            --primary-light: #d3f9e8;
            --dark: #12251d;
            --text: #34463d;
            --muted: #718078;
            --background: #f5f8f6;
            --white: #ffffff;
            --border: #e1ebe5;
            --shadow: 0 12px 35px rgba(15, 60, 40, 0.09);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 85px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1180px, 92%);
            margin: auto;
        }

        /* Preloader */

        #preloader {
            position: fixed;
            inset: 0;
            background: var(--white);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.4s ease;
        }

        .loader-icon {
            width: 65px;
            height: 65px;
            background: var(--primary);
            border-radius: 20px;
            color: white;
            display: grid;
            place-items: center;
            font-size: 32px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            to {
                transform: translateY(-10px);
            }
        }

        .loader-bar {
            width: 150px;
            height: 5px;
            background: #e3eee7;
            border-radius: 20px;
            overflow: hidden;
        }

        .loader-bar span {
            display: block;
            width: 40%;
            height: 100%;
            background: var(--primary);
            animation: loading 1.2s infinite;
        }

        @keyframes loading {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(280%);
            }
        }

        /* Header */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark);
            font-size: 21px;
            font-weight: 800;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            border-radius: 13px;
            background: var(--primary);
            display: grid;
            place-items: center;
            color: white;
            font-size: 24px;
        }

        .brand span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-cta {
            background: var(--primary);
            color: white !important;
            padding: 11px 18px;
            border-radius: 10px;
        }

        /* Hero */

        .hero {
            padding: 85px 0 80px;
            background:
                radial-gradient(circle at 85% 20%, #c6f6dd 0, transparent 30%),
                linear-gradient(135deg, #f5fff8, #e8f7ed);
            overflow: hidden;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 45px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #d9fbe8;
            color: #087f5b;
            padding: 8px 13px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 22px;
        }

        .hero h1 {
            color: var(--dark);
            font-size: clamp(37px, 5vw, 62px);
            line-height: 1.12;
            letter-spacing: -2px;
            margin-bottom: 22px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            color: var(--muted);
            max-width: 570px;
            font-size: 16px;
            margin-bottom: 28px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            border: none;
            border-radius: 11px;
            padding: 13px 19px;
            font-weight: 700;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-light {
            background: white;
            border: 1px solid var(--border);
            color: var(--dark);
        }

        .hero-visual {
            min-height: 340px;
            border-radius: 30px;
            background: linear-gradient(140deg, #087f5b, #034b36);
            padding: 30px;
            color: white;
            position: relative;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .hero-visual::before,
        .hero-visual::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 50%;
        }

        .hero-visual::before {
            width: 300px;
            height: 300px;
            right: -100px;
            top: -100px;
        }

        .hero-visual::after {
            width: 220px;
            height: 220px;
            left: -100px;
            bottom: -110px;
        }

        .bus-illustration {
            position: relative;
            z-index: 1;
            font-size: 105px;
            text-align: center;
            margin: 30px 0 15px;
        }

        .visual-card {
            position: relative;
            z-index: 1;
            padding: 16px;
            border-radius: 15px;
            background: rgba(255,255,255,0.13);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .visual-card small {
            opacity: 0.8;
        }

        .visual-card strong {
            display: block;
            font-size: 18px;
        }

        /* General sections */

        section {
            padding: 75px 0;
        }

        .section-heading {
            text-align: center;
            max-width: 720px;
            margin: 0 auto 35px;
        }

        .section-heading .eyebrow {
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-heading h2 {
            color: var(--dark);
            font-size: clamp(27px, 4vw, 38px);
            margin: 9px 0 12px;
        }

        .section-heading p {
            color: var(--muted);
            font-size: 14px;
        }

        /* Navigation section */

        #navigator {
            background: #edf5ef;
        }

        .navigator-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 22px;
            align-items: stretch;
        }

        .control-panel,
        .map-panel {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .control-panel {
            padding: 23px;
        }

        .panel-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .panel-description {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 23px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .input-control {
            width: 100%;
            padding: 12px;
            background: #f8fbf9;
            border: 1px solid #dce8e0;
            border-radius: 10px;
            outline: none;
            color: var(--dark);
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(8,127,91,0.1);
        }

        .button-stack {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .button-stack .btn {
            width: 100%;
        }

        .btn-outline {
            background: white;
            border: 1px solid #cfe0d4;
            color: var(--primary);
        }

        .btn-dark {
            background: #20382c;
            color: white;
        }

        .status-box {
            margin-top: 20px;
            padding: 13px;
            border-radius: 11px;
            background: #f2f8f4;
            color: #42604d;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .status-box strong {
            display: block;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .route-info {
            margin-top: 13px;
            padding: 15px;
            border-radius: 12px;
            background: #e4f9ed;
            display: none;
        }

        .route-info h3 {
            font-size: 15px;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .route-info p {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .route-info a {
            display: inline-block;
            margin-top: 8px;
            color: var(--primary-dark);
            font-weight: 800;
            font-size: 12px;
            text-decoration: underline;
        }

        .map-panel {
            min-height: 550px;
            display: flex;
            flex-direction: column;
        }

        .map-toolbar {
            padding: 14px 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }

        .map-toolbar strong {
            font-size: 14px;
            color: var(--dark);
        }

        .map-label {
            font-size: 11px;
            background: #d9fbe8;
            color: var(--primary-dark);
            padding: 6px 10px;
            border-radius: 30px;
            font-weight: 800;
        }

        #map {
            width: 100%;
            flex: 1;
            min-height: 500px;
            z-index: 1;
        }

        .map-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 13px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #087f5b;
        }

        .legend-dot.destination {
            background: #e03131;
        }

        .legend-dot.user {
            background: #1971c2;
        }

        .notice {
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
        }

        /* Features */

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .feature-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 25px;
            transition: 0.25s;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .feature-icon {
            width: 49px;
            height: 49px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #d9fbe8;
            font-size: 23px;
            margin-bottom: 17px;
        }

        .feature-card h3 {
            color: var(--dark);
            margin-bottom: 9px;
            font-size: 17px;
        }

        .feature-card p {
            color: var(--muted);
            font-size: 13px;
        }

        /* About */

        #about {
            background: #eaf5ee;
        }

        .about-card {
            max-width: 850px;
            margin: auto;
            text-align: center;
            background: white;
            padding: 35px;
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .about-card h2 {
            color: var(--dark);
            margin-bottom: 14px;
        }

        .about-card p {
            color: var(--muted);
            font-size: 14px;
        }

        /* Driver panel */

        .driver-box {
            max-width: 720px;
            margin: 30px auto 0;
            background: white;
            padding: 25px;
            border: 1px solid var(--border);
            border-radius: 17px;
            box-shadow: var(--shadow);
        }

        .driver-box h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .driver-box p {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .driver-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Footer */

        footer {
            background: #12251d;
            color: white;
            padding: 35px 0;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        footer p {
            font-size: 12px;
            color: #b7c9bd;
        }

        /* Chatbot */

        .chat-toggle {
            position: fixed;
            bottom: 22px;
            right: 22px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 26px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            z-index: 2000;
        }

        .chat-window {
            position: fixed;
            bottom: 92px;
            right: 22px;
            width: min(350px, calc(100vw - 30px));
            height: 430px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 55px rgba(0,0,0,0.2);
            overflow: hidden;
            display: none;
            flex-direction: column;
            z-index: 2000;
            border: 1px solid var(--border);
        }

        .chat-window.open {
            display: flex;
        }

        .chat-header {
            background: var(--primary);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header small {
            display: block;
            opacity: 0.8;
        }

        .chat-close {
            border: none;
            background: transparent;
            color: white;
            font-size: 24px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            background: #f7faf8;
        }

        .message {
            max-width: 88%;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .message.bot {
            background: white;
            border: 1px solid var(--border);
        }

        .message.user {
            margin-left: auto;
            background: #d9fbe8;
            color: #064d35;
        }

        .chat-form {
            padding: 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border);
        }

        .chat-form input {
            min-width: 0;
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 10px;
            outline: none;
        }

        .chat-form button {
            border: none;
            background: var(--primary);
            color: white;
            padding: 0 13px;
            border-radius: 9px;
            font-weight: 700;
        }

        /* Responsive */

        @media (max-width: 900px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }

            .hero-visual {
                min-height: 280px;
            }

            .navigator-layout {
                grid-template-columns: 1fr;
            }

            .map-panel {
                min-height: 450px;
            }

            #map {
                min-height: 430px;
            }

            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-links {
                gap: 12px;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                min-height: 65px;
            }

            .brand {
                font-size: 18px;
            }

            .nav-links a:not(.nav-cta) {
                display: none;
            }

            .nav-cta {
                padding: 9px 12px;
                font-size: 12px;
            }

            .hero {
                padding: 55px 0;
            }

            .hero h1 {
                letter-spacing: -1px;
            }

            section {
                padding: 55px 0;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .control-panel {
                padding: 18px;
            }

                min
